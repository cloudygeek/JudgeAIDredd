<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dredd side-by-side replay</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.7.1/dist/bundle/asciinema-player.css">
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; margin:0; padding:16px; }
  h1 { font-size:16px; font-weight:500; margin:0 0 12px; }
  .controls { margin:0 0 16px; display:flex; gap:8px; align-items:center; }
  button { padding:10px 20px; background:#222; color:#eee; border:1px solid #444; border-radius:4px; cursor:pointer; font-size:14px; }
  button:hover { background:#333; }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.primary:hover { background:#388bfd; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .col h2 { margin:0 0 8px; font-size:14px; font-weight:500; color:#aaa; }
  /* Hide per-player controls so the master buttons are the only driver
     and the two casts can never drift out of sync. */
  .col .ap-control-bar { display:none !important; }
</style>
</head>
<body>
<h1>Judge AI Dredd — side-by-side replay</h1>
<div class="controls">
  <button id="play" class="primary">▶ play both from start</button>
  <button id="pause">❚❚ pause</button>
  <button id="resume">▶ resume</button>
</div>
<div class="row">
  <div class="col"><h2>without Dredd</h2><div id="off"></div></div>
  <div class="col"><h2>with Dredd</h2><div id="on"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.7.1/dist/bundle/asciinema-player.min.js"></script>
<script>
  const opts = { autoPlay:false, idleTimeLimit:2, speed:2, theme:'monokai', controls:false };
  const off = AsciinemaPlayer.create('dredd-off.cast', document.getElementById('off'), opts);
  const on  = AsciinemaPlayer.create('dredd-on.cast',  document.getElementById('on'),  opts);

  // Always-from-zero start so the two casts begin together regardless of
  // where either was last paused. Reset both to t=0, pause to clear any
  // in-flight "playing" state, then start them on the same animation
  // frame so they kick off as close to simultaneously as the browser
  // can manage.
  document.getElementById('play').onclick = async () => {
    off.pause(); on.pause();
    await Promise.all([off.seek(0), on.seek(0)]);
    requestAnimationFrame(() => { off.play(); on.play(); });
  };
  document.getElementById('pause').onclick  = () => { off.pause(); on.pause(); };
  document.getElementById('resume').onclick = () => { off.play();  on.play();  };
</script>
</body>
</html>
